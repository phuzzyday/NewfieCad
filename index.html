<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NewfieCad</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
    { "imports": { "three": "./lib/three/build/three.module.js" } }
  </script>
</head>
<body>
  <header id="topbar">
    <span class="logo">NewfieCad</span>
    <div class="menu">
      <button id="btn-new" class="btn flat">New</button>
      <button id="btn-open" class="btn flat">Open…</button>
      <button id="btn-save" class="btn flat" title="Ctrl+S">Save</button>
      <span class="sep"></span>
      <button id="btn-stl" class="btn flat">Export STL</button>
      <button id="btn-3mf" class="btn flat">Export 3MF</button>
      <span class="sep"></span>
      <button id="btn-undo" class="btn icon" title="Undo (Ctrl+Z)"></button>
      <button id="btn-redo" class="btn icon" title="Redo (Ctrl+Y)"></button>
    </div>
    <span id="kernel-state" class="busy">Loading kernel…</span>
  </header>

  <nav id="toolbar"></nav>

  <main id="main">
    <aside id="browser"></aside>
    <section id="viewport-wrap">
      <div id="viewport"></div>
      <div id="viewcube-wrap">
        <div id="viewcube"></div>
        <div class="view-buttons">
          <button id="btn-home" class="btn icon" title="Home view"></button>
          <button id="btn-fit" class="btn icon" title="Fit (F6)"></button>
          <button id="btn-ortho" class="btn small" title="Switch projection">Perspective</button>
        </div>
        <select id="visual-style" class="style-select" title="Visual style"></select>
      </div>
      <div id="dim-box" hidden></div>
      <div id="stats"></div>
      <div id="nav-help">Middle-drag: pan · Shift + middle-drag: orbit · Wheel: zoom · Laptop: right-drag orbit, Shift + right-drag pan</div>
      <div id="loading">Loading the geometry kernel…</div>
    </section>
    <aside id="panel" hidden>
      <div class="panel-head" id="panel-title"></div>
      <div id="panel-body"></div>
      <div id="panel-buttons"></div>
    </aside>
  </main>

  <footer id="footer">
    <div id="timeline"></div>
    <div id="status"></div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
